name: CI Verification & Production Hardening Checks

on:
  push:
    branches: [main, 'development/**', 'repair/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test, Migrations, Audit & Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deterministic dependencies
        run: npm ci --no-audit --no-fund

      - name: Static secret & committed artifact hygiene check
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env file must not be committed to repository." >&2
            exit 1
          fi
          if [ -f bun.lock ]; then
            echo "ERROR: Obsolete bun.lock must not be committed alongside package-lock.json." >&2
            exit 1
          fi
          if ls data/backups/*.json >/dev/null 2>&1; then
            echo "ERROR: Customer database backup files must not be committed." >&2
            exit 1
          fi
          if grep -rnE '(sk_live_|re_[A-Za-z0-9]{20,}|AIzaSy[A-Za-z0-9_-]{30,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)' src server scripts docs --exclude-dir=node_modules; then
            echo "ERROR: Potential hardcoded secret detected." >&2
            exit 1
          fi

      - name: Dependency security audit (blocking high/critical threshold)
        run: npm audit --audit-level=high

      - name: Validate SQL migrations 001-007 ordering & RLS coverage
        run: npx tsx scripts/verify-migrations.ts

      - name: Verify snapshot-to-normalized reconciliation dry-run
        run: npx tsx scripts/reconcile-snapshot-to-normalized.ts

      - name: TypeScript typecheck and Oxlint
        run: npm run lint

      - name: Automated unit, integration & security regression tests
        run: npm test

      - name: Verify GitHub Pages custom-domain root build
        run: |
          GITHUB_PAGES=true GITHUB_PAGES_CUSTOM_DOMAIN=true npm run build:client
          test -f dist/index.html
          test -f dist/assets/celebration-sisters-logo.png
          test "$(cat dist/CNAME)" = 'celebrationsistersdecor.com'
          grep -q '/assets/' dist/index.html
          if grep -q '/CelebrationSistersEventDecor/assets/' dist/index.html; then
            echo "ERROR: GitHub Pages custom domain must use root-relative assets." >&2
            exit 1
          fi

      - name: Build frontend and compiled Express backend
        run: npm run build

      - name: Validate compiled frontend and server artifacts
        run: |
          test -f dist/index.html
          test -f dist-server/server.mjs
          if grep -q 'src="/src/main.tsx"' dist/index.html; then
            echo "Uncompiled Vite development entrypoint detected in dist/index.html" >&2
            exit 1
          fi

      - name: Production server fail-closed and compiled startup smoke test
        run: |
          # 1. Verify production mode fails closed without DATABASE_URL and SESSION_SECRET
          if NODE_ENV=production PORT=3198 node dist-server/server.mjs; then
            echo "ERROR: Production server started without DATABASE_URL / SESSION_SECRET" >&2
            exit 1
          fi

          # 2. Verify compiled bundle boots cleanly, responds on /health, /ready, and /api/auth/config, and handles SIGTERM
          PORT=3199 PERSISTENCE_ADAPTER=json-local CS_DB_PATH=/tmp/ci-smoke-db.json node dist-server/server.mjs &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3199/health >/dev/null; then
              break
            fi
            sleep 0.25
          done
          # Assert the actual response contracts. /ready returns ok + persistence,
          # while /api/auth/config reports identity-provider configuration.
          curl -fsS http://127.0.0.1:3199/health | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);if(j.ok!==true||j.status!=='alive')process.exit(1)})"
          curl -fsS http://127.0.0.1:3199/ready | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);if(j.ok!==true||j.persistence?.ready!==true)process.exit(1)})"
          curl -fsS http://127.0.0.1:3199/api/auth/config | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);if(typeof j.allowedOriginsCount!=='number')process.exit(1)})"
          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID"
          rm -f /tmp/ci-smoke-db.json

  docker-build:
    name: Docker Production Image Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build --tag celebration-sisters-prod:ci .
