name: Deploy Celebration Sisters frontend to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      VITE_API_BASE_URL: 'https://celebrationsisterseventdecor-production.up.railway.app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deterministic dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript and linter
        run: npm run lint
      - name: Run automated regression tests
        run: npm test
      - name: Build static frontend
        run: npm run build:client
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_CUSTOM_DOMAIN: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Validate compiled entrypoint
        run: |
          test -f dist/index.html
          test -f dist/assets/celebration-sisters-logo.png
          test -d dist/src/assets/images
          if grep -q 'src="/src/main.tsx"' dist/index.html; then
            echo "Uncompiled Vite development entrypoint detected" >&2
            exit 1
          fi
          test "$(cat dist/CNAME)" = 'celebrationsistersdecor.com'
          grep -q '/assets/' dist/index.html
          if grep -q '/CelebrationSistersEventDecor/assets/' dist/index.html; then
            echo "Incorrect repository-subpath asset URLs for custom domain" >&2
            exit 1
          fi
          test -z "$(find dist/assets/aistudio -type f -name 'Paste_*' -print -quit)"
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::VITE_API_BASE_URL must be configured for production booking."
            exit 1
          else
            case "$VITE_API_BASE_URL" in
              https://*) ;;
              *)
                echo "ERROR: VITE_API_BASE_URL must use https:// in production Pages deployments." >&2
                exit 1
                ;;
            esac
            if ! grep -Fq "$VITE_API_BASE_URL" dist/assets/*.js; then
              echo "ERROR: Configured VITE_API_BASE_URL was not embedded into dist/assets/*.js bundle." >&2
              exit 1
            fi
          fi
          if grep -Fq "celebrationsisterseventdecor-staging-staging.up.railway.app" dist/assets/*.js; then
            echo "ERROR: Staging Railway origin found in the production Pages bundle." >&2
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
