name: Deploy Celebration Sisters frontend to GitHub Pages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Verify TypeScript
        run: bun run lint
      - name: Build static frontend
        run: bun run build
        env:
          GITHUB_PAGES: 'true'
      - name: Validate compiled entrypoint
        run: |
          test -f dist/index.html
          if grep -q 'src="/src/main.tsx"' dist/index.html; then
            echo "Uncompiled Vite development entrypoint detected" >&2
            exit 1
          fi
          grep -q '/CelebrationSistersEventDecor/assets/' dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
