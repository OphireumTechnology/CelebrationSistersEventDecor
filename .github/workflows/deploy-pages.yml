name: Deploy Celebration Sisters frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static frontend
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Validate compiled entrypoint
        run: |
          test -f dist/index.html
          if grep -q 'src="/src/main.tsx"' dist/index.html; then
            echo "Uncompiled Vite development entrypoint detected" >&2
            exit 1
          fi
          grep -q '/CelebrationSistersEventDecor/assets/' dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
