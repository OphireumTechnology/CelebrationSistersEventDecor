name: Deploy Celebration Sisters frontend to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The committed bun.lock uses a format incompatible with Bun 1.3.2.
      # Use Node/npm until a compatible, verified lockfile is committed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify TypeScript and linter
        run: npm run lint
      - name: Run automated regression tests
        run: npm test
      - name: Build static frontend
        run: npm run build:client
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Validate compiled entrypoint
        run: |
          test -f dist/index.html
          test -f dist/assets/celebration-sisters-logo.png
          test -d dist/src/assets/images
          if grep -q 'src="/src/main.tsx"' dist/index.html; then
            echo "Uncompiled Vite development entrypoint detected" >&2
            exit 1
          fi
          grep -q '/CelebrationSistersEventDecor/assets/' dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
